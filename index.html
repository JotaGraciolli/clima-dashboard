<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard Clima</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #0f172a;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
  height: 100dvh; /* usa altura dinâmica real */
}

body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 12px;
  padding: 12px;
  box-sizing: border-box;
}

.card {
  background: #020617;
  border-radius: 18px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 8px 25px rgba(0,0,0,.4);
  overflow: hidden;
}

.top {
  text-align: center;
}

.city {
  font-size: 1.1rem;
  font-weight: bold;
}

.temp {
  font-size: 2.6rem;
  font-weight: bold;
  margin: 6px 0;
}

.details {
  font-size: .85rem;
  line-height: 1.3;
  opacity: .9;
}

/* Área reservada fixa para gráfico */
canvas {
  height: 90px !important;
  max-height: 90px;
}

/* Camada animada */
.card {
  position: relative;
  overflow: hidden;
}

/* Camada animada base */
.card::before,
.card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 18px;
  pointer-events: none;
}

/* ☁️ NUVENS REALISTAS EM CSS (sem imagem externa) */
.nublado::before {
  background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.4) 60px, transparent 70px),
    radial-gradient(circle at 60% 40%, rgba(255,255,255,0.35) 80px, transparent 90px),
    radial-gradient(circle at 80% 25%, rgba(255,255,255,0.3) 50px, transparent 60px);
  animation: moverNuvens 60s linear infinite;
  opacity: 0.35;
}

.nublado::after {
  background:
    radial-gradient(circle at 30% 70%, rgba(255,255,255,0.25) 70px, transparent 80px),
    radial-gradient(circle at 70% 60%, rgba(255,255,255,0.2) 90px, transparent 100px);
  animation: moverNuvens 90s linear infinite reverse;
  opacity: 0.25;
}

@keyframes moverNuvens {
  from { transform: translateX(-5%); }
  to { transform: translateX(5%); }
}


@keyframes nuvensLentas {
  from { background-position: 0 0; }
  to { background-position: 1500px 0; }

/* 🌅 PÔR DO SOL */
.por-do-sol::before {
  content: "";
  position: absolute;
  bottom: -40px;
  left: 50%;
  transform: translateX(-50%);
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffd27f 0%, #ff8c42 60%, transparent 70%);
  animation: descerSol 12s ease-in-out infinite alternate;
  opacity: 0.9;
}

.por-do-sol::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(255,140,66,0.4),
    rgba(255,94,77,0.3),
    rgba(15,23,42,0.6)
  );
  pointer-events: none;
}

@keyframes descerSol {
  from { transform: translate(-50%, 0px); }
  to { transform: translate(-50%, 20px); }
}


</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="card" id="c0">Carregando...</div>
<div class="card" id="c1">Carregando...</div>
<div class="card" id="c2">Carregando...</div>
<div class="card" id="c3">Carregando...</div>

<script>
const API_KEY = "369786570a7945f28dd143139261102";

const cidades = [
  { nome: "Santo Antônio da Patrulha", query: "-29.8256,-50.5178" },
  { nome: "Teixeira de Freitas", query: "-17.5392,-39.7400" },
  { nome: "Cariacica", query: "-20.2638,-40.4165" },
  { nome: "Teresina", query: "-5.0892,-42.8016" }
];

async function carregarCidade(cidade, elementoId) {
  try {

    const response = await fetch(
      `https://api.weatherapi.com/v1/forecast.json?key=${API_KEY}&q=${cidade.query}&days=1&aqi=no&alerts=no`
    );

    const data = await response.json();

    if (!response.ok) {
      document.getElementById(elementoId).innerHTML =
        "Erro API:<br>" + JSON.stringify(data);
      return;
    }

    const atual = data.current;
    const hoje = data.forecast.forecastday[0];

    const card = document.getElementById(elementoId); // ✅ DEFINIDO AQUI
    card.className = "card"; // reset classes

    // 🎨 DEFINIÇÃO DE FUNDO E ANIMAÇÃO
    let fundo;
    const condicao = atual.condition.text.toLowerCase();
    const ehDia = atual.is_day;
	const hora = new Date().getHours();

    if (condicao.includes("storm")) {
      fundo = "linear-gradient(to bottom, #312e81, #0f172a)";
      card.classList.add("chuva", "relampago");
    }
    else if (condicao.includes("rain")) {
      fundo = "linear-gradient(to bottom, #1e3a8a, #0f172a)";
      card.classList.add("chuva");
    }
    else if (condicao.includes("cloud")) {
      fundo = "linear-gradient(to bottom, #475569, #1e293b)";
      card.classList.add("nublado");
    }
    else if (!ehDia) {
      fundo = "linear-gradient(to bottom, #0f172a, #020617)";
      card.classList.add("noite");
    }
    else if (hora >= 17 && hora <= 18 && ehDia) {
	  fundo = "linear-gradient(to bottom, #ff9966, #ff5e62, #2c3e50)";
	  card.classList.add("por-do-sol");
	}
	else {
      fundo = "linear-gradient(to bottom, #38bdf8, #0ea5e9)";
    }

    // 🔵 Chuva alta prioridade
    if (hoje.day.daily_chance_of_rain > 60) {
      card.classList.add("chuva");
    }

    // 🔴 Calor extremo prioridade máxima
    if (atual.feelslike_c > 35) {
      fundo = "linear-gradient(to bottom, #7f1d1d, #450a0a)";
      card.classList.add("calor");
    }

    card.style.background = fundo;

    // 🖥️ HTML DO CARD
    const horaAtual = new Date().getHours();
    const proximasHoras = hoje.hour.slice(horaAtual, horaAtual + 6);

    card.innerHTML = `
      <div class="top">
        <div class="city">${cidade.nome}</div>
        <img src="https:${atual.condition.icon}">
        <div class="temp">${Math.round(atual.temp_c)}°C</div>
        <div class="details">
          Sensação ${Math.round(atual.feelslike_c)}°<br>
          Máx ${Math.round(hoje.day.maxtemp_c)}° • 
          Mín ${Math.round(hoje.day.mintemp_c)}°<br>
          Chuva ${hoje.day.daily_chance_of_rain}%
        </div>
      </div>

      <canvas id="grafico-${elementoId}" height="80"></canvas>
    `;

    // 📈 GRÁFICO
    const ctx = document.getElementById(`grafico-${elementoId}`);

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: proximasHoras.map(h => h.time.substring(11,16)),
        datasets: [{
          data: proximasHoras.map(h => h.temp_c),
          tension: 0.4,
          fill: true,
          borderWidth: 2,
          pointRadius: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { display: false },
          y: { display: false }
        }
      }
    });

  } catch (error) {
    document.getElementById(elementoId).innerHTML =
      "Erro JS:<br>" + error.message;
  }
}

function iniciar() {
  cidades.forEach((cidade, index) => {
    carregarCidade(cidade, "c" + index);
  });
}

iniciar();
setInterval(iniciar, 600000); // Atualiza a cada 10 minutos
</script>

</body>
</html>
